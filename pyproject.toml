[project]
name = "tome"
version = "0.1.0"
description = "A Markdown knowledge bank for LLM agents: raw sources, an agent-maintained wiki, SQLite search, served over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pyyaml>=6",
    "trafilatura>=2.0",
    "pypdf>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tome = "tome.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
